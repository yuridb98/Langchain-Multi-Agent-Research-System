services:
  - type: web
    name: researcher-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Secrets: set these in the Render dashboard (Settings -> Environment).
      # sync:false keeps values out of git -- Render prompts for them on first deploy.
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Production Streamlit overrides: no file watcher (nothing changes in a
      # container), no browser usage telemetry, headless (no browser to open).
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: "none"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
